name: Create Release PRs

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to release
        required: true
        default: main
        type: choice
        options:
          - main
          - v2.0
  push:
    branches:
      - main
      - v2.0

env:
  RELEASE_TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    # Creating v2.0 from main emits a push event. Wait for the first real commit
    # so the initial alpha can be bootstrapped deliberately with Release-As.
    if: github.event_name == 'workflow_dispatch' || github.event.created == false
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    steps:
      - name: release please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: ".release-please.manifest.json"
          config-file: ${{ env.RELEASE_TARGET_BRANCH == 'v2.0' && 'release-please.prerelease.config.json' || 'release-please.config.json' }}
          target-branch: ${{ env.RELEASE_TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

  publish-pypi-package:
    name: Build and publish Python package to PyPI
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/copick
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.4"
          python-version: "3.12"

      - name: Check lockfile
        run: uv lock --check

      - name: Verify Python version
        run: >
          uv run --no-project python -c
          "import sys; v = sys.version_info;
          assert (v.major, v.minor) == (3, 12), sys.version;
          assert v.releaselevel == 'final', sys.version;
          print(sys.version)"

      - name: build
        run: |
          uv build

      # release-please's own Python updater misses a version with a dotted prerelease suffix (2.0.0-alpha.1), so
      # src/copick/__init__.py carries an x-release-please-version marker; refuse to upload if it was still missed.
      - name: Check the built version is the release's
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: >
          uv run --no-project --with packaging python -c
          "import glob, os, sys; from packaging.version import Version;
          want = Version(os.environ['RELEASE_VERSION']);
          got = Version(os.path.basename(glob.glob('dist/*.whl')[0]).split('-')[1]);
          print(f'release {want}, built {got}');
          sys.exit(0 if got == want else f'Built {got}, but the release is {want}: src/copick/__init__.py was not bumped.')"

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
