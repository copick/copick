name: docs

on:
  pull_request:
    paths:
      - ".github/workflows/build-and-deploy-docs.yml"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
      - "zensical.toml"
  push:
    branches:
      - main
      - v2.0

permissions:
  contents: read

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.13"
          activate-environment: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install copick
        run: uv sync --locked --extra docs

      - name: Verify Python version
        run: >
          uv run --no-sync python -c
          "import sys; v = sys.version_info;
          assert (v.major, v.minor) == (3, 13), sys.version;
          assert v.releaselevel == 'final', sys.version;
          print(sys.version)"

      # The unified CLI reference documents plugin commands (convert/process/logical/
      # training/inference/download) contributed by these packages, so they must be
      # importable for `make_cli_docs` to introspect them. Installed separately from the
      # locked sync to keep the (heavy, torch-pulling) plugins out of the docs lockfile.
      # Uses the CPU torch wheel to keep the CI install light. These must be released with
      # the normalized command docstrings for the rendered docs to be up to date.
      - name: Install plugin packages for CLI introspection
        env:
          UV_TORCH_BACKEND: cpu
        # Pin minimum versions to the releases that ship the normalized command docstrings, so the
        # rendered CLI reference can't regress to an older (pre-normalization) plugin.
        run: uv pip install "copick-utils>=1.7.1" "copick-torch>=1.1.1" "copick-mcp>=0.6.0"

      # copick-easymode is git-only (not on PyPI) and its CLI module defers all heavy imports
      # (easymode/TensorFlow), so a --no-deps install is enough for make_cli_docs to introspect
      # `copick inference easymode` without pulling TensorFlow or the git-easymode/old-numpy chain.
      - name: Install copick-easymode for CLI introspection
        run: uv pip install --no-deps "copick-easymode @ git+https://github.com/copick/copick-easymode.git"

      # Plugin dependency resolution can replace the checkout and its locked
      # Zarr 3 runtime with released dependencies. Restore the branch under
      # test while retaining the separately installed plugins.
      - name: Restore the locked checkout runtime
        run: uv sync --locked --extra docs --inexact

      # Regenerate the per-command CLI reference pages and the CLI-Reference nav node
      # from the live --help/docstrings before building.
      - name: Generate CLI reference
        run: make_cli_docs

      # Build the book
      - name: Build the book
        run: |
          zensical build

      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 1

  deploy-book:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-book
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download rendered site
        uses: actions/download-artifact@v7
        with:
          name: docs-site-${{ github.sha }}
          path: site/

      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./site
          github_token: ${{ secrets.GITHUB_TOKEN }}
