name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COPICK_TEST_DATA_CACHE: ${{ github.workspace }}/.test-data-cache

jobs:
  prepare-test-corpus:
    name: prepare shared test corpus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: "3.13"

      - name: Restore verified corpus cache
        uses: actions/cache@v6
        with:
          path: ${{ env.COPICK_TEST_DATA_CACHE }}/sample_project.zip
          key: copick-test-corpus-${{ hashFiles('tests/corpus_registry.py') }}

      - name: Fetch and verify test corpus once
        run: >
          uv run --no-project --with pooch python
          tests/scripts/fetch_test_corpus.py --cache "$COPICK_TEST_DATA_CACHE"

      - name: Share test corpus with matrix jobs
        uses: actions/upload-artifact@v7
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}/sample_project.zip
          if-no-files-found: error
          retention-days: 1

  test-ubuntu-local:
    name: ubuntu local py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ubuntu-latest
    env:
      BACKEND: local
    strategy:
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Download shared test corpus
        uses: actions/download-artifact@v8
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: ${{ matrix.python-version }}

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: local

  test-ubuntu-s3:
    name: ubuntu s3 py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ubuntu-latest
    env:
      BACKEND: s3
      RUN_ALL: 1
    strategy:
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Download shared test corpus
        uses: actions/download-artifact@v8
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: ${{ matrix.python-version }}

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: s3

  test-ubuntu-ssh:
    name: ubuntu ssh py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ubuntu-latest
    env:
      BACKEND: ssh
      RUN_ALL: 1
    strategy:
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Download shared test corpus
        uses: actions/download-artifact@v8
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: ${{ matrix.python-version }}

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: ssh

  test-ubuntu-mlcroissant:
    name: ubuntu mlcroissant py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ubuntu-latest
    env:
      BACKEND: mlcroissant
      RUN_ALL: 1
    strategy:
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Download shared test corpus
        uses: actions/download-artifact@v8
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: ${{ matrix.python-version }}

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: mlcroissant

  test-macos:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ${{ matrix.platform }}
    env:
      RUN_ALL: 0
    strategy:
      matrix:
        platform: [
          macos-latest,
        ]
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Download shared test corpus
        uses: actions/download-artifact@v8
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: ${{ matrix.python-version }}

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Coverage
        uses: codecov/codecov-action@v7

  test-windows:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ${{ matrix.platform }}
    env:
      RUN_ALL: 0
    strategy:
      matrix:
        platform: [
          windows-latest,
        ]
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Download shared test corpus
        uses: actions/download-artifact@v8
        with:
          name: copick-test-corpus
          path: ${{ env.COPICK_TEST_DATA_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"
          python-version: ${{ matrix.python-version }}

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: copick/copick
