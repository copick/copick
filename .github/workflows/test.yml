      - name: Check lockfile
        run: uv lock --check

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Verify Python version
        run: >
          uv run --no-sync python -c
          "import sys; v = sys.version_info;
          assert (v.major, v.minor) == (3, 13), sys.version;
          assert v.releaselevel == 'final', sys.version;
          print(sys.version)"

      - name: Run live portal smoke test
        run: uv run --no-sync pytest -vvv -p no:warnings --color=yes -m portal tests/test_cli.py

  test-ubuntu-s3:
    name: ubuntu s3 py${{ matrix.python-version }}
    needs: prepare-test-corpus
    runs-on: ubuntu-latest
    env:
      BACKEND: s3
