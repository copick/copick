name: tests

on:
  push:
    branches:
      - main
      - v2.0
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - v2.0
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-ubuntu-local:
    name: ubuntu local py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      BACKEND: local
    strategy:
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14",
        ]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile
        run: uv lock --check

      - name: Install copick
        run: uv sync --locked --extra test --extra dev

      - name: Verify Python version
        run: >
          uv run --no-sync python -c
          "import sys; v = sys.version_info;
          expected = tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          assert (v.major, v.minor) == expected, sys.version;
          assert v.releaselevel == 'final', sys.version;
          print(sys.version)"

      - name: Run tests
        run: uv run pytest -vvv -p no:warnings --color=yes --cov --cov-branch --cov-report=xml --cov-report=term-missing -n auto tests

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: local

