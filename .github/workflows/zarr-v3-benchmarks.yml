name: Zarr v3 I/O benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/zarr-v3-benchmarks.yml"
      - "benchmarks/**"
      - "tests/test_zarr_v3_benchmark.py"
      - "src/copick/util/ome.py"
      - "src/copick/util/reconnecting_fs.py"
      - "src/copick/util/store.py"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.backend }} one-shard I/O
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [local, s3, ssh]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.13"

      - name: Install locked benchmark environment
        run: uv sync --locked --extra test --extra dev

      - name: Start Moto S3
        if: matrix.backend == 's3'
        run: |
          uv run --no-sync moto_server -H 127.0.0.1 -p 4001 >/tmp/copick-moto.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4001 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/copick-moto.log
          exit 1

      - name: Start SSH service
        if: matrix.backend == 'ssh'
        run: |
          mkdir -p tests/bin/ssh/test_data
          chmod 777 tests/bin/ssh/test_data
          HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f tests/docker-compose.yml --profile sshfs up -d
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 2222; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f tests/docker-compose.yml logs openssh-server
          exit 1

      - name: Run local benchmark
        if: matrix.backend == 'local'
        run: >
          uv run --no-sync python -m benchmarks.zarr_v3_io
          --backend local --repeats 1
          --output-json benchmark-results/local.json
          --output-markdown benchmark-results/local.md

      - name: Run S3 benchmark
        if: matrix.backend == 's3'
        run: >
          uv run --no-sync python -m benchmarks.zarr_v3_io
          --backend s3 --root s3://copick-zarr-v3-benchmark
          --storage-option key=test --storage-option secret=test
          --storage-option endpoint_url=http://127.0.0.1:4001
          --storage-option 'client_kwargs={"region_name":"us-west-2"}'
          --repeats 1
          --output-json benchmark-results/s3.json
          --output-markdown benchmark-results/s3.md

      - name: Run SSH benchmark
        if: matrix.backend == 'ssh'
        run: >
          uv run --no-sync python -m benchmarks.zarr_v3_io
          --backend ssh --root ssh:///config/test_data/copick-zarr-v3-benchmark
          --storage-option host=127.0.0.1 --storage-option port=2222
          --storage-option username=test.user --storage-option password=password
          --storage-option known_hosts=null --repeats 1
          --output-json benchmark-results/ssh.json
          --output-markdown benchmark-results/ssh.md

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: zarr-v3-io-${{ matrix.backend }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30

      - name: Stop SSH service
        if: always() && matrix.backend == 'ssh'
        run: docker compose -f tests/docker-compose.yml --profile sshfs down
